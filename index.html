<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#187457">
  <title>Cornetto Shop | Workspace</title>
  <link rel="stylesheet" href="cornetto.css">
  <link rel="stylesheet" href="workspace.css">
  <link rel="stylesheet" href="installment-import.css">
  <link rel="stylesheet" href="stock-edit.css">
  <script src="lucide.min.js" defer></script>
  <script src="card-schedule.js" defer></script>
  <script src="card-groups.js" defer></script>
  <script src="cornetto-modules.js" defer></script>
  <script src="cornetto.js" defer></script>
  <script src="money-input-v5.js" defer></script>
  <script src="sale-edit.js" defer></script>
  <script src="stock-edit.js" defer></script>
  <script src="installments.js" defer></script>
  <script src="installments-ui.js" defer></script>
  <script src="purchase-finance.js" defer></script>
  <script src="installment-import.js" defer></script>
  <script src="migration.js" defer></script>
  <script src="books-ui.js" defer></script>
  <script src="workspace.js" defer></script>
  <script src="supabase.min.js" defer></script>
  <script src="cloud-config.js" defer></script>
  <script src="cloud.js" defer></script>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#dashboard"><span class="brand-mark">c<span>.</span></span><span>Cornetto<span class="brand-sub">SHOP WORKSPACE</span></span></a>
    <p class="nav-label">WORKSPACE</p>
    <nav aria-label="Navigasi utama">
      <a href="#dashboard" data-nav="dashboard"><i data-lucide="layout-dashboard"></i>Ringkasan</a>
      <a href="#stock" data-nav="stock"><i data-lucide="package"></i>Inventori<span class="nav-count" id="stockCount"></span></a>
      <a href="#sales" data-nav="sales"><i data-lucide="shopping-bag"></i>Penjualan</a>
      <a href="#books" data-nav="books"><i data-lucide="book-open"></i>Pembukuan</a>
      <a href="#cards" data-nav="cards"><i data-lucide="credit-card"></i>Kartu kredit</a>
      <a href="#tax" data-nav="tax"><i data-lucide="receipt-text"></i>Pajak</a>
      <a href="#settings" data-nav="settings"><i data-lucide="settings-2"></i>Pengaturan</a>
      <a href="#data" data-nav="data"><i data-lucide="database"></i>Data & backup</a>
    </nav>
  </aside>
  <button class="nav-scrim" id="navScrim" aria-label="Tutup navigasi" hidden></button>
  <div class="workspace">
    <header class="topbar"><div class="breadcrumb"><button class="icon-button mobile-menu" id="menu" aria-label="Buka navigasi" title="Buka navigasi"><i data-lucide="menu"></i></button><span>Workspace</span><i data-lucide="chevron-right"></i><strong id="crumb">Ringkasan</strong></div><div class="top-right"><button class="icon-button" data-calculator="open" title="Kalkulator" aria-label="Kalkulator"><i data-lucide="calculator"></i></button><span class="demo-badge" id="cloudBadge">LOKAL</span><button class="icon-button" data-cloud="account" title="Akun cloud" aria-label="Akun cloud"><i data-lucide="cloud"></i></button><span class="top-date" id="todayLabel"></span></div></header>
    <main id="main"></main>
    <footer><span id="saveStatus" role="status">Memuat data...</span><span id="cloudSummary">Cloud belum tersambung</span></footer>
  </div>
  <dialog id="drawer" aria-labelledby="drawerTitle"><div class="drawer-head"><div><span class="eyebrow" id="drawerEyebrow">TRANSAKSI BARU</span><h2 id="drawerTitle"></h2></div><div class="drawer-tools"><button class="icon-button" data-calculator="open" aria-label="Kalkulator" title="Kalkulator"><i data-lucide="calculator"></i></button><button class="icon-button" id="closeDrawer" aria-label="Tutup panel" title="Tutup panel"><i data-lucide="x"></i></button></div></div><div id="drawerBody"></div></dialog>
  <dialog id="calculator" aria-labelledby="calculatorTitle"><div class="calculator-head"><h2 id="calculatorTitle">Kalkulator</h2><button class="icon-button" data-calculator="close" aria-label="Tutup kalkulator" title="Tutup kalkulator"><i data-lucide="x"></i></button></div><output id="calculatorDisplay" aria-live="polite">0</output><div class="calculator-keys"></div></dialog>
  <div id="toast" class="toast" role="status"></div>
</body>
</html>
